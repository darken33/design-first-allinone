asyncapi: 3.0.0
info:
  title: Hello Kafka API
  version: 1.0.0
  description: |
    Simple Hello Message API
  contact:
    name: Philippe Bousquet
    url: https://sqli.com
    email: philippe.bousquet@sqli.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  tags:
    - name: KafkaApi
      description: 'This is a sample API for demonstrating AsyncAPI with Kafka'
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    tags:
      - name: local
        description: 'This environment is meant for running internal tests '
channels:
  event.hello.v1:
    address: event.hello.v1
    messages:
      helloMessage:
        $ref: '#/components/messages/helloMessage'
    description: The topic on which hello messages may be produced and consumed.
operations:
  receiveHelloMessage:
    action: receive
    description: Receive a hello message
    channel:
      $ref: '#/channels/event.hello.v1'
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/channels/event.hello.v1/messages/helloMessage'
  sendHelloMessage:
    action: send
    description: Send a hello message
    channel:
      $ref: '#/channels/event.hello.v1'
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/channels/event.hello.v1/messages/helloMessage'
components:
  messages:
    helloMessage:
      name: helloMessage
      title: Hello Message
      summary: Hello Message.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/HelloMessagePayload'
  schemas:
    HelloMessagePayload:
      type: object
      properties:
        message:
          type: string
          pattern: ^Hello .+$
          descriptin: Message.
  operationTraits:
    kafka:
      bindings:
        kafka:
          groupId:
            type: string
            enum:
              - my-group-id
