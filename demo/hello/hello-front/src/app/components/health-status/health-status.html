<div class="health-container">
  @if (healthState().status === 'loading') {
    <span class="pulse-dot pulse-dot-grey"></span>
    <span class="badge-text">Vérification…</span>
  } @else if (healthData()) {
    <span class="pulse-dot pulse-dot-{{ badgeColor() }}"></span>
    <span class="badge-text">{{ healthData()!.status }}</span>
    @if (healthData()!.uptime !== undefined) {
      <span class="uptime">{{ healthData()!.uptime }}s</span>
    }
  } @else {
    <span class="pulse-dot pulse-dot-grey"></span>
    <span class="badge-text">Indisponible</span>
  }
</div>
