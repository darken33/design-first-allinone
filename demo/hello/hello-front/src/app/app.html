<div class="page-wrapper">
  <div class="container">

    <div class="status-bar">
      <app-health-status />
    </div>

    <div class="hero">
      <h1 class="hero-title">Hello World ✨</h1>
      <p class="hero-subtitle">Démonstration Angular 20 · Design-First API</p>
    </div>

    <section class="card">
      <p class="card-label"><span class="dot"></span>Salutation générique</p>
      <app-greeting [state]="genericState()" />
    </section>

    <section class="card">
      <p class="card-label"><span class="dot"></span>Salutation personnalisée</p>
      <form (ngSubmit)="onSubmit()" #nameForm="ngForm" class="name-form">
        <div class="form-row">
          <input
            type="text"
            name="name"
            [(ngModel)]="name"
            required
            minlength="2"
            maxlength="25"
            pattern="^[a-zA-Z ,.'\-]+$"
            placeholder="Votre prénom…"
            #nameInput="ngModel"
            class="name-input"
          />
          <button type="submit" [disabled]="!name.trim()" class="submit-btn">
            <span class="btn-text">Saluer</span>
            <span class="btn-icon">→</span>
          </button>
        </div>
        @if (nameInput.invalid && nameInput.dirty) {
          <p class="validation-error">⚠ Le prénom doit contenir 2 à 25 lettres (pas de chiffres).</p>
        }
      </form>
      <app-greeting [state]="personalizedState()" />
    </section>

  </div>
</div>
