name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run generate:api
      - run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run generate:api
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run generate:api
      - run: npm run test:integration

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hello-api-node:${{ github.sha }} .
      - name: Verify image size
        run: |
          SIZE=$(docker image inspect hello-api-node:${{ github.sha }} --format='{{.Size}}')
          MAX_SIZE=$((300 * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Image size ${SIZE} exceeds 300MB limit"
            exit 1
          fi
          echo "Image size OK: ${SIZE} bytes"
      - name: Smoke test container
        run: |
          docker run -d -p 3000:3000 --name smoke-test hello-api-node:${{ github.sha }}
          sleep 3
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/api/hello
          docker stop smoke-test

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes (staging)
        run: echo "kubectl apply -f kubernetes/ (configure kubeconfig in secrets)"
