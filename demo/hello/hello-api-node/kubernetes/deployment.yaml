apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api-node
  labels:
    app: hello-api-node
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-api-node
  template:
    metadata:
      labels:
        app: hello-api-node
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: hello-api-node
          image: hello-api-node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
